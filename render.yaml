services:
  - type: web
    name: etsy-listing-studio-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ETSY_API_KEY
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://hafeez45d.github.io
      - key: PORT
        value: "3000"
